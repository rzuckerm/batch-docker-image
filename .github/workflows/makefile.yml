name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Get docker version
      run: docker --version

    - name: Build docker images
      run: make build

    - name: Test docker images
      run: make test
